name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  ci:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (web)
        run: npm run lint -w apps/web

      - name: Lint (api)
        run: npm run lint -w apps/api

      - name: Type check (web)
        run: npm run typecheck -w apps/web

      - name: Type check (api)
        run: npm run typecheck -w apps/api

      - name: Test (api)
        run: npm run test -w apps/api

      - name: Test (web)
        run: npm run test -w apps/web

      # Construit via le même script que Vercel et vérifie que la Build Output
      # API atterrit bien à la racine du dépôt. Sans cette assertion, une
      # régression sur le chemin de sortie ne se verrait qu'au déploiement.
      - name: Build (web, Vercel output)
        run: |
          npm run build:vercel
          test -d .vercel/output/functions \
            || { echo "::error::.vercel/output/functions absent à la racine"; exit 1; }

      - name: Build (api)
        run: npm run build -w apps/api
        env:
          SUPABASE_URL: https://mock-url.supabase.co
          SUPABASE_ANON_KEY: mock-anon-key
          DATABASE_URL: postgresql://mock:mock@localhost:5432/mock
