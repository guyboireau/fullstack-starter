services:
  # ─────────────────────────────────────
  # PostgreSQL Database
  # ─────────────────────────────────────
  # Base locale optionnelle : l'application parle à Supabase, pas directement à
  # ce Postgres. Utile pour rejouer les migrations de supabase/migrations/ hors
  # ligne ou brancher un client SQL.
  db:
    image: postgres:15-alpine
    container_name: fullstack-db
    restart: unless-stopped
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-fullstack_starter}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-postgres}']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────
  # NestJS API
  # ─────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: fullstack-api
    restart: unless-stopped
    ports:
      - '${API_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      # Le front tourne dans un autre conteneur : l'origine autorisée est celle
      # vue depuis le navigateur de l'hôte.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:4321}
    volumes:
      - ./apps/api/src:/app/apps/api/src
      # Empêche le node_modules de l'hôte d'écraser celui de l'image.
      - /app/node_modules
    depends_on:
      db:
        condition: service_healthy

  # ─────────────────────────────────────
  # Astro SSR Frontend
  # ─────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: fullstack-web
    restart: unless-stopped
    ports:
      # 4321 = port du serveur de dev Astro (l'ancien 5173 datait du front Vite).
      - '4321:4321'
    env_file:
      - .env
    environment:
      # Depuis le conteneur web, l'API est joignable par son nom de service.
      API_URL: http://api:3000
    volumes:
      - ./apps/web/src:/app/apps/web/src
      # Empêche le node_modules de l'hôte d'écraser celui de l'image.
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
